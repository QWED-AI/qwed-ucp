[build-system]
# Backend pinned so builds cannot silently pick up a new Hatchling release
# (CodeAnt/Greptile on PR #48). Kept in sync with the `hatchling` dev pin below.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "qwed-ucp"
version = "0.3.0"
description = "QWED verification for Universal Commerce Protocol (UCP) transactions"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Rahul Dass", email = "rahul@qwedai.com"}
]
keywords = ["qwed", "ucp", "commerce", "verification", "ai", "llm", "google"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.0.0",
    "PyJWT>=2.15.0",
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "starlette>=0.27.0",
    "httpx>=0.24.0",
    # Build backend pinned in uv.lock so `python -m build --no-isolation`
    # (CI + release) uses exactly this version instead of resolving an
    # unpinned Hatchling into a throwaway environment.
    "hatchling==1.32.4",
    # Build frontend for the packaging check in CI / release, also locked.
    "build==1.6.1",
]

[project.urls]
Homepage = "https://github.com/QWED-AI/qwed-ucp"
Documentation = "https://github.com/QWED-AI/qwed-ucp#readme"
Repository = "https://github.com/QWED-AI/qwed-ucp"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "RUF022", "RUF100"]
ignore = ["B018", "BLE001", "RUF012", "RUF013", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["qwed_ucp"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwed_ucp"]
