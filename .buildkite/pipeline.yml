steps:
  - label: ":lint: Lint"
    commands:
      - pip install ruff
      - ruff check src/ tests/
    timeout_in_minutes: 5

  - label: ":python: Test (3.10)"
    commands:
      - pip install --upgrade pip
      - pip install -e ".[dev]"
      - PYTHONPATH=src pytest tests/ -q --timeout=30 -p no:cacheprovider
    timeout_in_minutes: 10

  - label: ":python: Test (3.11)"
    commands:
      - pip install --upgrade pip
      - pip install -e ".[dev]"
      - PYTHONPATH=src pytest tests/ -q --timeout=30 -p no:cacheprovider
    timeout_in_minutes: 10

  - label: ":python: Test (3.12)"
    commands:
      - pip install --upgrade pip
      - pip install -e ".[dev]"
      - PYTHONPATH=src pytest tests/ -q --timeout=30 -p no:cacheprovider
    timeout_in_minutes: 10

  - label: ":locked: Security scan"
    commands:
      - pip install --upgrade pip
      - pip install -e .
      - pip freeze --exclude qwed-ucp > /tmp/requirements.txt
      - pip install pip-audit
      - pip-audit --strict --desc -r /tmp/requirements.txt
    timeout_in_minutes: 5
