name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # sonar S8475/S7077: versions pinned to uv.lock, and --only-binary :all:
        # blocks build-backend/setup-script execution for third-party deps.
        # The project is imported from src/ (PYTHONPATH below), so no
        # source build of the first-party package is required here.
        run: |
          pip install --only-binary :all: pytest==9.1.1 pytest-cov==7.1.0 PyJWT==2.15.0 jsonschema==4.26.0 starlette==1.3.1 httpx==0.28.1

      - name: Run tests
        run: |
          PYTHONPATH=src pytest tests/ -v --cov=src/qwed_ucp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@0561704f0f02c16a585d4c7555e57fa2e44cf909 # v5.5.2
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned so CI does not silently resolve a new ruff release.
        run: pip install --only-binary :all: ruff==0.16.1

      - name: Lint with ruff
        run: ruff check src/ tests/
