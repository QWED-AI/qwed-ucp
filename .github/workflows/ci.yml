name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        # Sonar S8475/S7077 + Greptile/CodeAnt: the whole dependency graph is
        # installed from uv.lock, so CI cannot resolve versions the lockfile
        # does not pin. --no-build keeps third-party installs wheel-only (no
        # setup scripts); --no-install-project skips the first-party build (the
        # package is imported from src/ via PYTHONPATH in the test step).
        run: |
          pip install --only-binary :all: uv==0.11.29
          uv sync --locked --no-build --no-install-project --extra dev

      - name: Verify the distribution builds
        # Greptile: source tests alone never proved the sdist/wheel can be
        # built. --no-isolation reuses the locked dev environment (hatchling is
        # pinned in uv.lock), so no unpinned backend is resolved here.
        run: .venv/bin/python -m build --no-isolation

      - name: Run tests
        run: |
          PYTHONPATH=src .venv/bin/python -m pytest tests/ -v --cov=src/qwed_ucp --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@0561704f0f02c16a585d4c7555e57fa2e44cf909 # v5.5.2
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned so CI does not silently resolve a new ruff release.
        # (Quoted: ":all:" would otherwise break plain-scalar YAML parsing.)
        run: 'pip install --only-binary :all: ruff==0.16.1'

      - name: Lint with ruff
        run: ruff check src/ tests/
