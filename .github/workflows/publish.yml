name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7
      
      - name: Set up Python
        uses: actions/setup-python@39cd14951b08e74b54015e9e001cdefcf80e669f # v5.1.1
        with:
          python-version: "3.11"
      
      - name: Install uv (pinned)
        run: 'pip install --only-binary :all: uv==0.11.29'

      - name: Sync locked build environment
        # uv.lock pins both the build frontend and the Hatchling backend, so the
        # release cannot pick up a new backend version.
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Build package
        # --no-isolation builds with the Hatchling version pinned in uv.lock
        # instead of resolving an unpinned backend into an isolated environment.
        run: .venv/bin/python -m build --no-isolation
      
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
    
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # unstable/v1
